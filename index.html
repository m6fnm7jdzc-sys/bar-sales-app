<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売上管理システム</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif; background:#111; color:#fff; padding:14px; padding-bottom:90px; }
h1 { text-align:center; color:#d4af37; font-size:1.25rem; margin-bottom:14px; letter-spacing:1px; }
#loading { text-align:center; color:#d4af37; padding:50px 0; font-weight:bold; }

.summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.summary-box { background:#1c1c1c; border:1px solid #333; border-radius:8px; padding:10px; text-align:center; }
.summary-box.total { grid-column:span 2; border-color:#d4af37; background:#2a2411; }
.summary-box .lbl { font-size:0.72rem; color:#aaa; margin-bottom:4px; }
.summary-box .val { font-size:1.05rem; font-weight:bold; color:#fff; }
.summary-box.total .val { color:#d4af37; font-size:1.3rem; }

.add-row { display:flex; gap:8px; margin-bottom:10px; }
.add-row input { flex:1; padding:10px; border-radius:8px; border:1px solid #d4af37; background:#222; color:#fff; font-size:1rem; }
#searchInput { width:100%; padding:10px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; font-size:1rem; margin-bottom:10px; }
.btn-gold { background:#d4af37; color:#111; border:none; border-radius:8px; padding:0 16px; font-weight:bold; cursor:pointer; font-size:1rem; }

.tabs { display:flex; gap:8px; margin-bottom:12px; }
.tab-btn { flex:1; text-align:center; padding:8px; border-radius:8px; border:1px solid #444; background:#1c1c1c; color:#aaa; font-size:0.85rem; cursor:pointer; }
.tab-btn.active { background:#d4af37; color:#111; font-weight:bold; border-color:#d4af37; }

.customer-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(95px,1fr)); gap:10px; margin-bottom:20px; }
.c-tile { background:#222; border:1px solid #444; border-radius:8px; padding:12px 6px; text-align:center; cursor:pointer; }
.c-tile.has-bal { border-color:#e74c3c; background:#3a1c1c; }
.c-tile .c-name { font-weight:bold; font-size:0.9rem; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c-tile .c-bal { font-size:0.72rem; color:#8bc48b; }
.c-tile.has-bal .c-bal { color:#ff7675; font-weight:bold; }

.history-toggle { text-align:center; margin:16px 0 8px; }
.history-toggle button { background:none; border:1px solid #555; color:#aaa; padding:7px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
.history-list { display:none; }
.history-list.show { display:block; }
.history-item { background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:0.78rem; color:#ccc; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.history-item .h-amt { color:#d4af37; font-weight:bold; margin-left:auto; }
.h-cancel { background:#a33; color:#fff; border:none; padding:3px 8px; border-radius:5px; font-size:0.7rem; cursor:pointer; }

.footer-actions { display:flex; flex-direction:column; gap:10px; align-items:stretch; margin-top:20px; }
.footer-actions button { padding:11px 0; border-radius:8px; font-size:0.85rem; cursor:pointer; font-weight:bold; }
.btn-csv { background:none; border:1px solid #2e8b57; color:#a5d6a7; }
.btn-reset { background:none; border:1px solid #a33; color:#e88; }

.empty { text-align:center; color:#555; padding:24px 0; }

.m-cash { color:#a5d6a7; }
.m-qr { color:#90caf9; }
.m-credit { color:#f48fb1; }

.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:50; align-items:center; justify-content:center; padding:16px; }
.modal-bg.show { display:flex; }
.modal-content { background:#1c1c1c; border:1px solid #d4af37; border-radius:12px; width:100%; max-width:400px; max-height:92vh; overflow-y:auto; padding:20px; position:relative; }
.close-x { position:absolute; top:10px; right:14px; font-size:1.6rem; color:#aaa; background:none; border:none; cursor:pointer; }
.m-title { font-size:1.15rem; font-weight:bold; color:#d4af37; margin-bottom:6px; padding-right:24px; }
.status-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:0.8rem; color:#aaa; }
.btn-toggle { background:#333; color:#eee; border:1px solid #666; border-radius:6px; padding:5px 10px; font-size:0.72rem; cursor:pointer; }

.menu-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:0.85rem; }
.menu-name { flex:1; color:#ddd; padding-right:8px; }
.qty-ctrl { display:flex; align-items:center; gap:8px; }
.qty-ctrl button { width:30px; height:30px; border-radius:50%; border:1px solid #d4af37; background:transparent; color:#d4af37; font-size:1.1rem; cursor:pointer; }
.qty-num { width:22px; text-align:center; font-weight:bold; }

.calc-area { background:#111; border-radius:8px; padding:12px; margin:16px 0; }
.calc-row { display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.9rem; }
.calc-row.total { font-weight:bold; color:#d4af37; font-size:1.05rem; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:8px; }
.calc-row.bal { font-weight:bold; color:#ff7675; font-size:1.05rem; margin-top:8px; border-top:1px dashed #444; padding-top:8px; }

.pay-action { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.pay-input-row { display:flex; align-items:center; gap:8px; }
.pay-input-row input { flex:1; padding:10px; font-size:1.1rem; text-align:right; border-radius:8px; border:1px solid #555; background:#000; color:#fff; }
.pay-btns { display:flex; gap:8px; }
.pay-btns button { flex:1; padding:11px 0; font-weight:bold; border:none; border-radius:8px; cursor:pointer; color:#fff; font-size:0.85rem; }
.btn-cash { background:#27ae60; }
.btn-qr { background:#2980b9; }
.btn-credit { background:#d35400; }

.m-history-title { font-size:0.85rem; color:#d4af37; margin:6px 0 8px; }
.m-hist-item { display:flex; align-items:center; gap:6px; font-size:0.78rem; background:#242424; border-radius:6px; padding:6px 8px; margin-bottom:5px; flex-wrap:wrap; }
.m-hist-amt { margin-left:auto; font-weight:bold; color:#d4af37; }
.m-hist-cancel { background:#a33; color:#fff; border:none; padding:2px 7px; border-radius:5px; font-size:0.68rem; cursor:pointer; }

.del-btn-wrap { text-align:center; margin-top:20px; }
.btn-del { background:none; border:1px solid #a33; color:#e88; padding:8px 16px; border-radius:8px; font-size:0.8rem; cursor:pointer; }
</style>
</head>
<body>

<h1>🥂 売上管理システム</h1>
<div id="loading">📡 データベースに接続中...</div>

<div id="appContent" style="display:none;">
  <div class="summary-grid">
    <div class="summary-box total">
      <div class="lbl">本日の総売上（支払済）</div>
      <div class="val" id="sumTotal">¥0</div>
    </div>
    <div class="summary-box"><div class="lbl">💴 現金</div><div class="val" id="sumCash">¥0</div></div>
    <div class="summary-box"><div class="lbl">📱 QR決済</div><div class="val" id="sumQr">¥0</div></div>
    <div class="summary-box"><div class="lbl">💳 クレジット</div><div class="val" id="sumCredit">¥0</div></div>
    <div class="summary-box" style="grid-column:span 2;"><div class="lbl">⚠️ 未払い残高合計</div><div class="val" id="sumBal" style="color:#ff7675;">¥0</div></div>
  </div>

  <div class="add-row">
    <input type="text" id="nameInput" placeholder="お客様名 / テーブル名">
    <button class="btn-gold" onclick="addCustomer()">＋追加</button>
  </div>

  <input type="text" id="searchInput" placeholder="🔍 名前で検索" oninput="render()">

  <div class="tabs">
    <div class="tab-btn active" id="tabOpen" onclick="switchTab('open')">🟡 接客中</div>
    <div class="tab-btn" id="tabDone" onclick="switchTab('done')">✅ 会計済み（退店済）</div>
  </div>

  <div class="customer-grid" id="customerGrid"></div>
  <div class="empty" id="emptyGrid">お客様がいません</div>

  <div class="history-toggle">
    <button onclick="toggleHistory()">📖 本日の支払い履歴を表示／非表示</button>
  </div>
  <div class="history-list" id="historyList"></div>

  <div class="footer-actions">
    <button class="btn-csv" onclick="exportCsv()">📄 本日の売上をCSV出力</button>
    <button class="btn-reset" onclick="resetAll()">🗑 本日の営業終了（全データリセット）</button>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal-content">
    <button class="close-x" onclick="closeModal()">×</button>
    <div class="m-title" id="mTitle"></div>
    <div class="status-row">
      <span id="mStatusLabel"></span>
      <button class="btn-toggle" id="mToggleBtn" onclick="toggleCheckedOut()"></button>
    </div>

    <div id="mMenuItems"></div>

    <div class="calc-area">
      <div class="calc-row total"><span>注文合計</span><span id="mOrderTotal">¥0</span></div>
      <div class="calc-row"><span>支払い済み合計</span><span id="mPaidTotal">¥0</span></div>
      <div class="calc-row bal"><span>未払い残高</span><span id="mBalance">¥0</span></div>
    </div>

    <div class="pay-action">
      <div style="font-size:0.8rem;color:#aaa;">▼ 受け取る金額を確認し、支払い方法をタップしてください</div>
      <div class="pay-input-row">
        <span>¥</span>
        <input type="number" id="payAmount">
      </div>
      <div class="pay-btns">
        <button class="btn-cash" onclick="addPayment('cash')">💴 現金</button>
        <button class="btn-qr" onclick="addPayment('qr')">📱 QR</button>
        <button class="btn-credit" onclick="addPayment('credit')">💳 クレカ</button>
      </div>
    </div>

    <div class="m-history-title">この方の支払い履歴</div>
    <div id="mHistoryList"></div>

    <div class="del-btn-wrap">
      <button class="btn-del" onclick="deleteCustomer()">🗑 このお客様をリストから削除</button>
      <div style="font-size:0.7rem;color:#666;margin-top:4px;">※支払い履歴は削除されません</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKGr82qocIKQXgLLWFWVUWa6q-7NwbZB4",
  authDomain: "bar-sales-19a45.firebaseapp.com",
  projectId: "bar-sales-19a45",
  storageBucket: "bar-sales-19a45.firebasestorage.app",
  messagingSenderId: "850237380521",
  appId: "1:850237380521:web:fc2e2762bb29e9faad56b8",
  measurementId: "G-6GK5NBBLKD"
};

const RESET_PASSWORD = "19911003";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "bar_data", "main_state");

const MENU = [
  { id:'plan_early', name:'飲み放題（21:00〜0:00）', price:3000 },
  { id:'plan_late',  name:'飲み放題（0:00以降ご来店）', price:4000 },
  { id:'ext_male',   name:'0:00以降 延長（男性）', price:3000 },
  { id:'ext_female', name:'0:00以降 延長（女性）', price:2000 },
  { id:'orishan',    name:'オリシャン', price:15000 },
  { id:'shot',       name:'ショット（テキーラ・イェーガー）', price:500 },
  { id:'ferris',     name:'ショット観覧車', price:5000 },
];

// 画面表示用のラベル（絵文字つき）※CSVラベルとは別管理
const METHOD_LABEL = { cash:'💴 現金', qr:'📱 QR', credit:'💳 クレカ' };
const METHOD_CLASS = { cash:'m-cash', qr:'m-qr', credit:'m-credit' };
// CSV出力専用のラベル（画面表示には影響しません）
const CSV_METHOD_LABEL = { cash:'現金', qr:'QR決済', credit:'クレジットカード' };

let customers = [];
let history = [];
let nextId = 1;
let currentCid = null;
let currentTab = 'open';

onSnapshot(docRef, (snap) => {
  if (snap.exists()) {
    const d = snap.data();
    customers = d.customers || [];
    history   = d.history   || [];
    nextId    = d.nextId    || 1;
  } else {
    customers = []; history = []; nextId = 1;
    saveState();
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  render();
}, (err) => {
  document.getElementById('loading').textContent = '⚠️ 接続エラー：電波状況やFirebaseのルール設定を確認してください';
  console.error(err);
});

async function saveState(){
  await setDoc(docRef, { customers, history, nextId });
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function calcCustomerData(c){
  let orderTotal = 0;
  for(const [mid, qty] of Object.entries(c.items||{})){
    const m = MENU.find(x=>x.id===mid);
    if(m) orderTotal += m.price*qty;
  }
  const paidTotal = history.filter(h=>h.cid===c.id).reduce((s,h)=>s+h.amount,0);
  return { orderTotal, paidTotal, balance: orderTotal - paidTotal };
}

window.addCustomer = function(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return;
  const newId = nextId++;
  customers.push({ id:newId, name, items:{}, checkedOut:false });
  input.value = '';
  saveState();
  render();
  window.openModal(newId);
};
document.getElementById('nameInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') window.addCustomer();
});

window.openModal = function(cid){
  currentCid = cid;
  renderModal();
  document.getElementById('modalBg').classList.add('show');
};
window.closeModal = function(){
  document.getElementById('modalBg').classList.remove('show');
  currentCid = null;
};

window.changeQty = function(mid, delta){
  const c = customers.find(c=>c.id===currentCid);
  if(!c) return;
  if(!c.items) c.items = {};
  const cur = c.items[mid] || 0;
  const next = Math.max(0, cur+delta);
  if(next===0) delete c.items[mid]; else c.items[mid]=next;
  saveState(); renderModal(); render();
};

window.addPayment = function(method){
  const c = customers.find(x=>x.id===currentCid);
  if(!c) return;
  const amtInput = document.getElementById('payAmount');
  const amount = parseInt(amtInput.value, 10);
  if(isNaN(amount) || amount<=0){ alert('正しい金額を入力してください'); return; }
  if(!confirm(`${c.name} 様から ${METHOD_LABEL[method]} で ¥${amount.toLocaleString()} 受け取りました。記録しますか？`)) return;
  history.unshift({
    id: Date.now()+Math.floor(Math.random()*1000),
    cid: c.id,
    name: c.name,
    amount, method,
    time: new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
  });
  saveState(); renderModal(); render();
};

window.cancelPayment = function(hid){
  if(!confirm('この支払い履歴を取り消しますか？\n受け取った金額は「未払い残高」に戻ります。')) return;
  history = history.filter(h=>h.id!==hid);
  saveState(); renderModal(); render();
};

window.toggleCheckedOut = function(){
  const c = customers.find(x=>x.id===currentCid);
  if(!c) return;
  c.checkedOut = !c.checkedOut;
  saveState(); renderModal(); render();
};

window.deleteCustomer = function(){
  if(!confirm('このお客様をリストから削除しますか？（支払い履歴は残ります）')) return;
  customers = customers.filter(c=>c.id!==currentCid);
  saveState(); closeModal(); render();
};

window.switchTab = function(tab){
  currentTab = tab;
  document.getElementById('tabOpen').classList.toggle('active', tab==='open');
  document.getElementById('tabDone').classList.toggle('active', tab==='done');
  render();
};
window.toggleHistory = function(){
  document.getElementById('historyList').classList.toggle('show');
};

// ── CSV出力 ──
window.exportCsv = function(){
  if(history.length===0){
    alert('まだ支払い履歴がありません');
    return;
  }
  const BOM = '\uFEFF'; // Excelでの文字化け防止
  const header = '日時,お客様名,支払い方法,金額(円)\n';
  const rows = history.slice().reverse().map(h=>{
    const method = CSV_METHOD_LABEL[h.method] || h.method;
    const safeName = String(h.name).replace(/"/g,'""');
    return `"${h.time}","${safeName}","${method}",${h.amount}`;
  }).join('\n');

  const sumCash   = history.filter(h=>h.method==='cash').reduce((s,h)=>s+h.amount,0);
  const sumQr     = history.filter(h=>h.method==='qr').reduce((s,h)=>s+h.amount,0);
  const sumCredit = history.filter(h=>h.method==='credit').reduce((s,h)=>s+h.amount,0);
  const sumTotal  = sumCash+sumQr+sumCredit;
  const summary = `\n\n集計,,現金,${sumCash}\n集計,,QR決済,${sumQr}\n集計,,クレジット,${sumCredit}\n集計,,総売上,${sumTotal}`;

  const blob = new Blob([BOM + header + rows + summary], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  a.href = url;
  a.download = `売上履歴_${y}${m}${d}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// ── パスワード保護つきリセット ──
window.resetAll = function(){
  if(!confirm('本日の全データ（お客様・支払い履歴）を消去します。\n※消去前に必要であれば「CSV出力」でバックアップを取ってください。\n\nよろしいですか？')) return;
  const pwd = prompt('確認のため、パスワードを入力してください');
  if(pwd === null) return; // キャンセル
  if(pwd !== RESET_PASSWORD){
    alert('パスワードが違います。データは消去されませんでした。');
    return;
  }
  customers = []; history = []; nextId = 1;
  saveState();
  render();
  alert('本日のデータをリセットしました。');
};

function render(){
  const sumCash = history.filter(h=>h.method==='cash').reduce((s,h)=>s+h.amount,0);
  const sumQr   = history.filter(h=>h.method==='qr').reduce((s,h)=>s+h.amount,0);
  const sumCredit = history.filter(h=>h.method==='credit').reduce((s,h)=>s+h.amount,0);
  const sumTotal = sumCash+sumQr+sumCredit;

  let sumBal = 0;
  customers.forEach(c=>{ sumBal += calcCustomerData(c).balance; });

  document.getElementById('sumTotal').textContent = `¥${sumTotal.toLocaleString()}`;
  document.getElementById('sumCash').textContent = `¥${sumCash.toLocaleString()}`;
  document.getElementById('sumQr').textContent = `¥${sumQr.toLocaleString()}`;
  document.getElementById('sumCredit').textContent = `¥${sumCredit.toLocaleString()}`;
  document.getElementById('sumBal').textContent = `¥${sumBal.toLocaleString()}`;

  const searchTerm = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  let filtered = customers.filter(c => currentTab==='open' ? !c.checkedOut : c.checkedOut);
  if(searchTerm) filtered = filtered.filter(c=>c.name.toLowerCase().includes(searchTerm));
  filtered = filtered.slice().reverse();

  const grid = document.getElementById('customerGrid');
  const empty = document.getElementById('emptyGrid');
  empty.style.display = filtered.length===0 ? 'block':'none';

  grid.innerHTML = filtered.map(c=>{
    const data = calcCustomerData(c);
    const hasBal = data.balance>0;
    return `<div class="c-tile ${hasBal?'has-bal':''}" onclick="openModal(${c.id})">
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-bal">${hasBal?`未払¥${data.balance.toLocaleString()}`:'支払済'}</div>
    </div>`;
  }).join('');

  const hList = document.getElementById('historyList');
  hList.innerHTML = history.length===0
    ? '<div class="empty">まだ支払い履歴はありません</div>'
    : history.map(h=>`<div class="history-item">
        <span>${h.time} ${esc(h.name)}様</span>
        <span class="${METHOD_CLASS[h.method]}">${METHOD_LABEL[h.method]}</span>
        <span class="h-amt">¥${h.amount.toLocaleString()}</span>
        <button class="h-cancel" onclick="cancelPayment(${h.id})">取消</button>
      </div>`).join('');

  if(currentCid!==null) renderModal();
}

function renderModal(){
  if(currentCid===null) return;
  const c = customers.find(x=>x.id===currentCid);
  if(!c){ window.closeModal(); return; }

  document.getElementById('mTitle').textContent = `👤 ${c.name} 様`;
  document.getElementById('mStatusLabel').textContent = c.checkedOut ? '✅ 会計済み（退店済）' : '🟡 接客中';
  document.getElementById('mToggleBtn').textContent = c.checkedOut ? '接客中に戻す' : '退店（会計済みにする）';

  const rows = MENU.map(m=>{
    const qty = (c.items && c.items[m.id]) || 0;
    return `<div class="menu-row">
      <span class="menu-name">${m.name}<br><small style="color:#d4af37">¥${m.price.toLocaleString()}</small></span>
      <div class="qty-ctrl">
        <button onclick="changeQty('${m.id}',-1)">－</button>
        <span class="qty-num">${qty}</span>
        <button onclick="changeQty('${m.id}',1)">＋</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('mMenuItems').innerHTML = rows;

  const data = calcCustomerData(c);
  document.getElementById('mOrderTotal').textContent = `¥${data.orderTotal.toLocaleString()}`;
  document.getElementById('mPaidTotal').textContent  = `¥${data.paidTotal.toLocaleString()}`;
  document.getElementById('mBalance').textContent    = `¥${data.balance.toLocaleString()}`;
  document.getElementById('payAmount').value = data.balance>0 ? data.balance : '';

  const myHist = history.filter(h=>h.cid===c.id);
  document.getElementById('mHistoryList').innerHTML = myHist.length===0
    ? '<div style="color:#666;font-size:0.8rem;padding:6px 0;">まだ支払い記録はありません</div>'
    : myHist.map(h=>`<div class="m-hist-item">
        <span>${h.time}</span>
        <span class="${METHOD_CLASS[h.method]}">${METHOD_LABEL[h.method]}</span>
        <span class="m-hist-amt">¥${h.amount.toLocaleString()}</span>
        <button class="m-hist-cancel" onclick="cancelPayment(${h.id})">取消</button>
      </div>`).join('');
}

// 検索ボックスの oninput="render()" から呼び出せるよう、
// render関数を明示的にグローバル(window)へ公開します（今回の修正の核心部分）
window.render = render;
</script>
</body>
</html>
